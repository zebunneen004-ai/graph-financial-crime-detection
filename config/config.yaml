project:
  name: "Transaction Network Analysis for Financial Crime Detection and AML Alert Prioritization"
  seed: 42

paths:
  raw_data: "data/raw"
  legacy_raw_data: "data"
  processed_data: "data/processed"
  results_final: "results/final"
  results_archive: "results/archive"
  figures_final: "figures/final"
  figures_archive: "figures/archive"
  models_final: "models/final"
  models_archive: "models/archive"
  logs: "logs"
  report: "report"
  employer_brief: "employer_brief"

expected:
  nodes: 203769
  edges: 234355
  illicit: 4545
  licit: 42019
  unknown: 157205
  labeled: 46564
  time_steps: 49
  supplied_predictors: 165
  local_supplied_predictors_excluding_time_step: 93
  one_hop_aggregated_predictors: 72

splits:
  train_start: 1
  train_end: 30
  calibration_start: 31
  calibration_end: 35
  operating_start: 36
  operating_end: 40
  test_start: 41
  test_end: 49

cv_folds:
  - train: [1, 10]
    validation: [11, 15]
  - train: [1, 15]
    validation: [16, 20]
  - train: [1, 20]
    validation: [21, 25]
  - train: [1, 25]
    validation: [26, 30]

graph:
  pagerank_alpha: 0.85
  pagerank_tolerance: 1.0e-08
  pagerank_max_iterations: 1000

models:
  threads: 2
  default_xgboost:
    n_estimators: 250
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1
    gamma: 0.0
    reg_alpha: 0.0
    reg_lambda: 1.0
  random_forest:
    n_estimators: 300
    min_samples_leaf: 2
    max_features: "sqrt"
  tuning:
    n_trials: 20
    practical_margin_pr_auc: 0.01
    minimum_tuning_gain_pr_auc: 0.002
    parameter_space:
      n_estimators: [100, 150, 200, 250, 300, 400]
      max_depth: [3, 4, 5, 6, 7, 8]
      learning_rate: [0.02, 0.03, 0.05, 0.08, 0.1, 0.15]
      subsample: [0.65, 0.75, 0.85, 0.95, 1.0]
      colsample_bytree: [0.65, 0.75, 0.85, 0.95, 1.0]
      min_child_weight: [1, 2, 3, 5, 8, 10]
      gamma: [0.0, 0.05, 0.1, 0.25, 0.5]
      reg_alpha: [0.0, 0.05, 0.1, 0.25, 0.5, 1.0]
      reg_lambda: [0.5, 1.0, 1.5, 2.0, 3.0]

bootstrap:
  repetitions: 2000
  confidence_level: 0.95

calibration:
  method: "sigmoid"
  bins: 10

alerts:
  candidate_budgets: [0.01, 0.05, 0.10, 0.20]
  selection_rule: "highest_operating_f1_then_smallest_budget"

explainability:
  shap_sample_size: 2000
  permutation_repeats: 5
  max_display: 20
